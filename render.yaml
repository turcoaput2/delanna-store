services:
  - type: web
    name: delanna-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
