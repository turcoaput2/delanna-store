{% extends 'base.html' %}
{% block title %}Editar producto · Admin{% endblock %}
{% block content %}
<div class="container admin-panel">
  <h2 class="page-title">Editar producto</h2>
  <div class="admin-section" style="max-width:600px;">
    <form method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label>Nombre</label>
        <input name="name" value="{{ product.name }}" required>
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea name="description" rows="2">{{ product.description or '' }}</textarea>
      </div>
      <div style="display:flex;gap:14px;">
        <div class="form-group" style="flex:1">
          <label>Precio</label>
          <input type="number" step="0.01" min="0" name="price" value="{{ product.price }}" required>
        </div>
        <div class="form-group" style="flex:1">
          <label>Stock</label>
          <input type="number" min="0" name="stock" value="{{ product.stock }}" required>
        </div>
      </div>
      <div class="form-group">
        {% if product.image_url %}
        <label>Imagen actual</label>
        <img src="{{ product.image_url }}" alt="" style="max-height:160px;border-radius:8px;margin-bottom:10px;">
        {% endif %}
        <label>{% if product.image_url %}Cambiar imagen{% else %}Imagen{% endif %} <span class="text-muted">(opcional)</span></label>
        <input type="file" name="image" accept="image/*">
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary">Guardar cambios</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
