{% extends 'base.html' %}
{% block title %}Admin · Delanna Lencería{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <h2>Panel de administración</h2>
    <form method="post">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="admin@delanna.com" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="Contraseña" required>
      </div>
      <button class="btn btn-dark w-100">Ingresar al panel</button>
    </form>
    <p class="small text-muted mt-3 mb-0">Acceso exclusivo para administradores.</p>
  </div>
</div>
{% endblock %}
