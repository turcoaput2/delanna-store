{% extends 'base.html' %}
{% block title %}Registro · Delanna Lencería{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <h2>Crear cuenta</h2>
    <form method="post">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" minlength="8" required placeholder="Mínimo 8 caracteres">
      </div>
      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input type="password" name="password_confirm" minlength="8" required placeholder="Repetí tu contraseña">
      </div>
      <button class="btn btn-primary w-100">Registrarme</button>
    </form>
    <p class="small text-muted mt-3 mb-0">¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Ingresá</a></p>
  </div>
</div>
{% endblock %}
