{% extends 'base.html' %}
{% block title %}Ingresar · Delanna Lencería{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <h2>Ingresar</h2>
    <form method="post">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required placeholder="Tu contraseña">
      </div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="small text-muted mt-3 mb-0">¿No tenés cuenta? <a href="{{ url_for('auth.register') }}">Registrate</a></p>
  </div>
</div>
{% endblock %}
